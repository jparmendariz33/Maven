<!doctype html>
<html><head><meta charset="utf-8"><title>Finance Short Engine</title>
<style>
@font-face{font-family:'Unbounded';src:url('../assets/fonts/Unbounded-400.ttf');font-weight:400}
@font-face{font-family:'Unbounded';src:url('../assets/fonts/Unbounded-600.ttf');font-weight:600}
@font-face{font-family:'Unbounded';src:url('../assets/fonts/Unbounded-800.ttf');font-weight:800}
@font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk-400.ttf');font-weight:400}
@font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk-500.ttf');font-weight:500}
@font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk-700.ttf');font-weight:700}
@font-face{font-family:'Instrument Serif';src:url('../assets/fonts/InstrumentSerif-400.ttf');font-style:italic;font-weight:400}
html,body{margin:0;background:#111}canvas{display:block;margin:auto;max-height:100vh}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Carga el video indicado en ?v=/ruta/absoluta/a/build/video.js (o ?v=../videos/<id>/build/video.js)
const P=new URLSearchParams(location.search);
window.ENGINE_READY=new Promise(res=>{
  const s=document.createElement('script');s.src=P.get('v');
  s.onload=()=>{const e=document.createElement('script');e.src='engine.js';e.onload=res;document.body.appendChild(e)};
  s.onerror=()=>{document.body.insertAdjacentHTML('beforeend','<p style="color:#fff">No se encontró video.js: '+P.get('v')+'</p>')};
  document.body.appendChild(s);
});
</script></body></html>
